<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#242528" />
    <title>视唱练耳</title>
  <link rel="manifest" href="manifest.webmanifest"><style>body{margin:0;background:#242528;}
#app-startup {
  box-sizing: border-box;
  max-width: 38rem;
  margin: 12vh auto 2rem;
  padding: 24px;
  color: #f4f1ea;
  background: #242528;
  font:
    16px/1.6 system-ui,
    -apple-system,
    'Segoe UI',
    sans-serif;
  overflow-wrap: break-word;
}
#app-startup[hidden],
#app-startup [hidden] {
  display: none !important;
}
#app-startup h1 {
  margin: 0 0 16px;
  font-size: 24px;
  line-height: 1.4;
}
#app-startup p {
  margin: 12px 0;
}
#app-startup summary {
  padding: 12px 0;
  cursor: pointer;
}
#app-startup pre {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font: 13px/1.6 monospace;
}
#app-startup button {
  min-height: 48px;
  max-width: 100%;
  margin-top: 8px;
  padding: 12px 20px;
  border: 1px solid #d3c7ac;
  border-radius: 8px;
  color: #242528;
  background: #eee7d8;
  font: inherit;
  cursor: pointer;
  touch-action: manipulation;
}
#app-startup button:focus-visible {
  outline: 3px solid #8ad5ff;
  outline-offset: 3px;
}

#app-release-notice {
  position: fixed;
  z-index: 60;
  right: 16px;
  bottom: 84px;
  bottom: calc(84px + env(safe-area-inset-bottom, 0px));
  left: 16px;
  box-sizing: border-box;
  max-width: 34rem;
  margin: 0 auto;
  padding: 16px 20px;
  border: 1px solid #a68dcc;
  border-radius: 14px;
  background: #303137;
  color: #f4f1ea;
  box-shadow: 0 8px 28px #0005;
  font:
    14px/1.5 system-ui,
    -apple-system,
    'Segoe UI',
    sans-serif;
  overflow-wrap: break-word;
}
#app-release-notice[hidden] {
  display: none !important;
}
#app-release-title {
  font-size: 16px;
}
#app-release-notice p {
  margin: 8px 0 12px;
}
#app-release-notice .release-notice-actions {
  display: flex;
  justify-content: flex-end;
  flex-wrap: wrap;
  gap: 10px;
}
#app-release-notice button {
  min-height: 44px;
  min-width: 76px;
  padding: 8px 16px;
  border: 1px solid #bda3ff;
  border-radius: 8px;
  background: transparent;
  color: inherit;
  box-shadow: none;
  font: inherit;
  touch-action: manipulation;
  cursor: pointer;
}
#app-release-notice #app-release-ack {
  background: #bda3ff;
  color: #242528;
}
#app-release-notice button:focus-visible {
  outline: 3px solid #8ad5ff;
  outline-offset: 3px;
}
[data-theme='paper'] #app-release-notice {
  background: #fffdf8;
  color: #242528;
}

.notation-answer .notation-interactive[role='button']:not([aria-label*='擦除']) {
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}

.notation-answer
  .notation-interactive[data-touch-note-input='true']:not([aria-label*='擦除'])::after {
  content: '谱面内按住选音，松手填入；谱面外滑动页面。';
  display: block;
  padding: 6px 10px 10px;
  color: #414b46;
  font-size: 12px;
  line-height: 1.5;
  cursor: default;
}
</style>
</head>
  <body>
    <div id="root"></div>
<section id="app-startup" role="status" aria-live="polite" aria-labelledby="app-startup-title">
  <h1 id="app-startup-title">正在打开视唱练耳</h1>
  <p id="app-startup-message">首次打开或网络较慢时，可能需要稍等。</p>
  <details id="app-startup-details" hidden>
    <summary>错误详情（可截图反馈给老师）</summary>
    <pre id="app-startup-diagnostic"></pre>
  </details>
  <p>重新加载不会清除本机学习记录和录音。请勿使用浏览器的“清除网站数据”。</p>
  <button id="app-startup-retry" type="button" hidden>重新加载</button>
  <noscript
    ><p>
      浏览器已禁用 JavaScript，应用无法启动。请在浏览器设置中启用 JavaScript 后重新打开。
    </p></noscript
  >
</section>

<aside
  id="app-release-notice"
  role="status"
  aria-live="polite"
  aria-labelledby="app-release-title"
  hidden
>
  <strong id="app-release-title">应用已更新</strong>
  <p>已修复录音提交、播放完成判定和离线准备，并改进学习推荐与数据恢复。已有学习记录和录音保留。</p>
  <div class="release-notice-actions">
    <button id="app-release-later" type="button">稍后</button>
    <button id="app-release-ack" type="button">知道了</button>
  </div>
</aside>

<script>/* Runs before the application module; never reads or writes student storage. */
(function () {
  var panel = document.getElementById('app-startup');
  var title = document.getElementById('app-startup-title');
  var message = document.getElementById('app-startup-message');
  var retry = document.getElementById('app-startup-retry');
  var details = document.getElementById('app-startup-details');
  var diagnostic = document.getElementById('app-startup-diagnostic');
  var root = document.getElementById('root');
  var finished = false;
  var failureCode = '';

  function fileName(value) {
    return String(value || '')
      .split(/[?#]/)[0]
      .split('/')
      .pop()
      .slice(0, 120);
  }

  function errorText(error) {
    if (typeof error === 'string') return error.slice(0, 300);
    if (!error || typeof error.message !== 'string') return '浏览器未提供具体错误';
    return (String(error.name || 'Error') + ': ' + error.message).slice(0, 300);
  }

  function restoringData() {
    // V1 renders this placeholder before its asynchronous startup has completed.
    return root.textContent.trim() === '正在恢复本地状态…';
  }

  function showFailure(reason, code, info) {
    if (finished) return;
    if (failureCode && !/_TIMEOUT$/.test(failureCode)) return;
    failureCode = code;
    title.textContent = '暂时无法打开视唱练耳';
    message.textContent = reason;
    diagnostic.textContent =
      '诊断版本：v1-2026-10-21-maintenance\n错误编号：' +
      code +
      '\n时间：' +
      new Date().toISOString() +
      '\n' +
      info +
      '\n浏览器：' +
      navigator.userAgent;
    details.hidden = false;
    panel.setAttribute('role', 'alert');
    retry.hidden = false;
  }

  function checkReady() {
    var style = document.getElementById('app-styles');
    if (!root.firstElementChild || restoringData() || !style || !style.sheet) return;
    var responsive = document.getElementById('app-responsive');
    if (responsive && !responsive.sheet) return;
    finished = true;
    panel.hidden = true;
    window.clearTimeout(timeout);
    window.clearInterval(poll);
    window.removeEventListener('error', onError, true);
    window.removeEventListener('unhandledrejection', onRejection);
  }

  function onError(event) {
    var target = event.target;
    if (
      target &&
      target !== window &&
      target.id !== 'app-entry' &&
      target.id !== 'app-styles' &&
      target.id !== 'app-responsive'
    )
      return;
    if (target && target.id === 'app-entry') {
      showFailure(
        '应用主程序未能加载完成。请重新加载；若反复出现，请展开错误详情并反馈给老师。',
        'ENTRY_LOAD',
        '文件：' + fileName(target.src)
      );
    } else if (target && (target.id === 'app-styles' || target.id === 'app-responsive')) {
      showFailure(
        '页面样式未能加载完成。请重新加载；若反复出现，请展开错误详情并反馈给老师。',
        target.id === 'app-styles' ? 'STYLE_LOAD' : 'RESPONSIVE_STYLE_LOAD',
        '文件：' + fileName(target.href)
      );
    } else {
      showFailure(
        '应用启动时发生了脚本错误。请展开错误详情并截图反馈给老师。',
        'SCRIPT_ERROR',
        errorText(event.error || event.message) +
          '\n位置：' +
          fileName(event.filename) +
          ':' +
          (event.lineno || 0) +
          ':' +
          (event.colno || 0)
      );
    }
  }

  function onRejection(event) {
    showFailure(
      '应用启动遇到问题。请重新加载；若仍失败，请展开错误详情并反馈给老师。',
      'STARTUP_REJECTION',
      errorText(event.reason)
    );
  }

  retry.addEventListener('click', function () {
    // A normal reload preserves IndexedDB, localStorage and recorded audio.
    window.location.reload();
  });
  window.addEventListener('error', onError, true);
  window.addEventListener('unhandledrejection', onRejection);
  var timeout = window.setTimeout(function () {
    // Keep the concrete failure available instead of replacing it with a generic timeout.
    if (failureCode) return;
    showFailure(
      restoringData()
        ? '恢复本机学习记录的等待时间较长。可以继续等待，或重新加载。请勿清除网站数据，以免丢失本机学习记录和录音。'
        : '加载时间较长。可以继续等待，或切换网络后重新加载。请勿清除网站数据，以免丢失本机学习记录和录音。',
      restoringData() ? 'RESTORE_TIMEOUT' : 'LOAD_TIMEOUT',
      '等待应用启动超过 20 秒；尚未收到具体错误。'
    );
  }, 20000);
  var poll = window.setInterval(checkReady, 200);
})();
</script>

<script>/* Only the independent announcement acknowledgement is persisted. */
(function () {
  var acknowledgementKey = 'ear-training:release-notice-ack';
  var release = 'v1-2026-10-21-maintenance';
  var panel = document.getElementById('app-release-notice');
  var startup = document.getElementById('app-startup');
  var root = document.getElementById('root');
  var dismissed = false;
  try {
    if (window.localStorage.getItem(acknowledgementKey) === release) return;
  } catch (_) {
    // Storage restrictions must not prevent opening or dismissing the announcement.
  }

  function inspect() {
    var heading = root.querySelector('h1');
    var checkingMicrophone = Array.prototype.some.call(
      root.querySelectorAll('button:disabled'),
      function (button) {
        return button.textContent.trim() === '开始麦克风检测';
      }
    );
    panel.hidden =
      dismissed ||
      !startup.hidden ||
      !root.firstElementChild ||
      !root.querySelector('.app-shell > .app-header') ||
      !!root.querySelector(
        '.onboarding, .settings-panel, .workbench, .recording-progress, [role="alert"]'
      ) ||
      checkingMicrophone ||
      !!(heading && heading.textContent.trim() === '暂时无法打开本地训练');
  }

  var observer = new MutationObserver(inspect);
  observer.observe(startup, { attributes: true, attributeFilter: ['hidden'] });
  observer.observe(root, {
    childList: true,
    subtree: true,
    characterData: true,
    attributes: true,
    attributeFilter: ['class', 'disabled']
  });

  function dismiss(remember) {
    if (dismissed) return;
    dismissed = true;
    panel.hidden = true;
    observer.disconnect();
    if (remember) {
      try {
        window.localStorage.setItem(acknowledgementKey, release);
      } catch (_) {
        /* This visit stays dismissed. */
      }
    }
  }
  document.getElementById('app-release-ack').addEventListener('click', function () {
    dismiss(true);
  });
  document.getElementById('app-release-later').addEventListener('click', function () {
    dismiss(false);
  });
  inspect();
})();
</script>
